apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount.helloService }}
  selector:
    matchLabels:
      app: hello-service
  template:
    metadata:
      labels:
        app: hello-service
    spec:
      containers:
        - name: hello-service
          image: "{{ .Values.images.helloService.repository }}:{{ .Values.images.helloService.tag }}"
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
          resources:
{{ toYaml .Values.resources.helloService | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: hello-service
  ports:
    - port: {{ .Values.services.helloService.port }}
      targetPort: 3001
  type: ClusterIP
