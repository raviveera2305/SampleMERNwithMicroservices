apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-service
  namespace: mern-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-service
  template:
    metadata:
      labels:
        app: hello-service
    spec:
      containers:
        - name: hello-service
          image: 526362561261.dkr.ecr.ap-south-1.amazonaws.com/hello-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello-service
  namespace: mern-app
spec:
  selector:
    app: hello-service
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP